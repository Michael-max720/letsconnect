<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">Reset password</div>
<div class="container" style="max-width:420px;">
  <div id="error-box" class="alert alert-error" style="display:none;"></div>

  <div id="step-email">
    <p style="color:var(--sub); margin-top:20px;">Enter your account email to receive a reset code.</p>
    <div class="field"><label>Email</label><input type="email" id="email" required></div>
    <button class="btn btn-primary" id="request-btn">Send reset code</button>
  </div>

  <div id="step-reset" style="display:none;">
    <p style="color:var(--sub); margin-top:20px;">Enter the code you received and a new password.</p>
    <div class="field"><label>Reset code</label><input type="text" id="code" maxlength="6" style="letter-spacing:4px; text-align:center;"></div>
    <div class="field"><label>New password</label><input type="password" id="newPassword" minlength="6"></div>
    <button class="btn btn-primary" id="confirm-btn">Reset password</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
let resetUserId = null;

document.getElementById('request-btn').addEventListener('click', async () => {
  try {
    const data = await api('/auth/request-reset', {
      method: 'POST',
      body: JSON.stringify({ email: document.getElementById('email').value }),
    });
    resetUserId = data.userId;
    document.getElementById('step-email').style.display = 'none';
    document.getElementById('step-reset').style.display = 'block';
  } catch (err) { showError(err.message); }
});

document.getElementById('confirm-btn').addEventListener('click', async () => {
  try {
    await api('/auth/confirm-reset', {
      method: 'POST',
      body: JSON.stringify({
        userId: resetUserId,
        code: document.getElementById('code').value,
        newPassword: document.getElementById('newPassword').value,
      }),
    });
    alert('Password updated. Please log in.');
    window.location.href = '/login.html';
  } catch (err) { showError(err.message); }
});
</script>
</body>
</html>
