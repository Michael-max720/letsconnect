<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify account - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">Verify account</div>
<div class="container" style="max-width:420px;">
  <p style="margin-top:24px; color:var(--sub);">Enter the 6-digit code sent to your email.</p>
  <div id="error-box" class="alert alert-error" style="display:none;"></div>

 <form id="verify-form">
  <div class="field">
    <label>Verification code</label>
    <input type="text" id="code" maxlength="6" required style="letter-spacing:4px; font-size:18px; text-align:center;">
  </div>
  <button type="submit" class="btn btn-primary">Verify</button>
</form>
<p id="resend-text" style="text-align:center; color:var(--sub); font-size:13px; margin-top:14px;">
  Resend code in <span id="countdown">60</span>s
</p>
<a href="#" id="resend-link" class="btn-link" style="display:none;">Resend code</a>
</div>

<script src="/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const userId = params.get('userId');
let secondsLeft = 60;
let timerInterval;

function startCountdown() {
  secondsLeft = 60;
  document.getElementById('resend-text').style.display = 'block';
  document.getElementById('resend-link').style.display = 'none';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    secondsLeft--;
    document.getElementById('countdown').textContent = secondsLeft;
    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      document.getElementById('resend-text').style.display = 'none';
      document.getElementById('resend-link').style.display = 'block';
    }
  }, 1000);
}
startCountdown();

document.getElementById('resend-link').addEventListener('click', async (e) => {
  e.preventDefault();
  try {
    await api('/auth/resend-otp', {
      method: 'POST',
      body: JSON.stringify({ userId: Number(userId) }),
    });
    startCountdown();
  } catch (err) {
    showError(err.message);
  }
});

document.getElementById('verify-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const data = await api('/auth/verify-otp', {
      method: 'POST',
      body: JSON.stringify({ userId: Number(userId), code: document.getElementById('code').value }),
    });
    if (data.status === 'pending_approval') {
      alert('Account verified. Your account is now awaiting admin approval before you can log in.');
      window.location.href = '/login.html';
    } else {
      alert('Account verified. You can now log in.');
      window.location.href = '/login.html';
    }
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>
