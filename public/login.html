<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">Lets Connect</div>
<div class="container" style="max-width:420px;">
  <div class="frosted-panel" style="margin-top:40px;">
    <h2 style="margin-top:0;">Log in</h2>
    <div id="error-box" class="alert alert-error" style="display:none;"></div>


  <form id="login-form">
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <div style="position:relative;">
        <input type="password" id="password" required style="padding-right:44px;">
        <button type="button" onclick="togglePassword('password', this)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:13px; color:var(--sub); font-weight:600;">Show</button>
      </div>
    </div>
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub); margin:10px 0;">
  <input type="checkbox" id="rememberMe"> Remember me
</label>
    <button type="submit" class="btn btn-primary">Log in</button>
    <a href="/register.html" class="btn-link">New here? Create an account</a>
     <a href="/forgot-password.html" class="btn-link">Forgot password?</a>
  </form>
</div>

<script src="/js/api.js"></script>
<script src="/js/bg-rotator.js"></script>
<script>
  const EYE_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSED = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a20.3 20.3 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a20.3 20.3 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x₁="₁" y₁="₁" x₂="₂" y₂="₂"/></svg>';

function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.innerHTML = input.type === 'password' ? EYE_OPEN : EYE_CLOSED;
}
startBackgroundRotator([
  'https://www.pexels.com/photo/a-person-walking-while-carrying-a-backpack-10521177/',
  'https://images.pexels.com/photos/20179680/pexels-photo-20179680.jpeg',
  'https://images.pexels.com/photos/30174882/pexels-photo-30174882.jpeg',
  'https://images.unsplash.com/photo-1573152958734-1922c188fba3?q=80&w=1032&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?q=80&w=1007&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://images.pexels.com/photos/4555454/pexels-photo-4555454.jpeg',
  'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://unsplash.com/photos/man-playing-drums-PKmjFH8dGMU'
]);
</script>
<script>
function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Hide';
  } else {
    input.type = 'password';
    btn.textContent = 'Show';
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        rememberMe: document.getElementById('rememberMe').checked 
      }),
    });
    const destinations = {
      attendee: '/events.html',
      organiser: '/organiser-dashboard.html',
      admin: '/admin-dashboard.html',
      gate_agent: '/gate-scan.html',
    };
    window.location.href = destinations[data.role] || '/events.html';
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>
