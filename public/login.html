<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | {brand}</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
<link rel="stylesheet" href="/css/brand.css">
<style>
body{overflow:hidden;color:#fff}
.shade{position:absolute;inset:0;background:
 linear-gradient(to right,rgba(0,0,0,.6),transparent 60%),
 linear-gradient(to bottom,rgba(0,0,0,.4),transparent 280px),
 linear-gradient(to top,rgba(20,10,0,.45),transparent calc(420*var(--u)))}
.page{position:relative;display:flex;height:100dvh}
.hero{flex:1;position:relative;padding:calc(57*var(--u)) 0 calc(80*var(--u)) calc(92.5*var(--u));display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center}
.top a.back{color:var(--accent-soft);font-size:calc(17.4*var(--u));font-weight:520;margin-right:calc(40*var(--u))}
h1{font-size:calc(62*var(--u));line-height:calc(70*var(--u));font-weight:600;letter-spacing:calc(-2.6*var(--u))}
.sub{margin:calc(19*var(--u)) 0 calc(35.5*var(--u));font-size:calc(20*var(--u));line-height:calc(27.5*var(--u));font-weight:460;max-width:calc(640*var(--u))}
.panel{width:calc(742.4*var(--u));flex:none;margin:calc(18*var(--u)) calc(18*var(--u)) calc(22.5*var(--u)) 0;background:var(--card);color:var(--ink);border-radius:calc(20*var(--u));display:flex;align-items:center;padding-left:calc(96.2*var(--u))}
form{width:calc(559*var(--u));display:grid;gap:calc(24*var(--u))}
h2{font-size:calc(50.6*var(--u));font-weight:660;letter-spacing:calc(-1.9*var(--u))}
.lede{font-size:calc(19*var(--u));color:var(--text-2);margin-top:calc(-10*var(--u))}
.row{display:flex;justify-content:space-between;align-items:center;font-size:calc(17.4*var(--u))}
.foot{text-align:center;font-size:calc(17.4*var(--u));color:var(--text-2)}
@media (max-aspect-ratio:1/1){
 :root{--u:max(.5px,min(100vw/390,100dvh/844))}
 body{overflow:auto}.page{flex-direction:column;min-height:100dvh}
 .hero{flex:none;height:38dvh;padding:calc(24*var(--u)) calc(22*var(--u))}
 h1{font-size:calc(30*var(--u));line-height:calc(34*var(--u));letter-spacing:calc(-1*var(--u))}
 .sub{display:none}.top a.back{margin:0;font-size:calc(14*var(--u))}
 .logo{font-size:calc(22*var(--u))}.logo i{width:calc(32*var(--u));height:calc(32*var(--u));font-size:calc(20*var(--u))}
 .panel{width:auto;flex:1;margin:0;border-radius:calc(20*var(--u)) calc(20*var(--u)) 0 0;padding:calc(24*var(--u)) calc(22*var(--u))}
 form{width:100%;gap:calc(12*var(--u))}h2{font-size:calc(28*var(--u))}
 .btn,.input input{height:calc(48*var(--u));font-size:calc(15*var(--u))}
 .field label,.row,.check,.foot,.lede,.alert{font-size:calc(13*var(--u))}
}
</style>
</head>
<body>
<div class="media"></div><div class="shade"></div>
<main class="page">
  <section class="hero">
    <div class="top rise">
      <a class="logo" href="/events.html"><i><b data-letter></b></i><span data-brand></span></a>
      <a class="back" href="/events.html">← Back to events</a>
    </div>
    <div>
      <h1><span class="rise" style="--i:2;display:block">Find the event.</span><span class="rise" style="--i:3;display:block">Get your ticket.</span></h1>
      <p class="sub rise" style="--i:4">Browse concerts and events across Kenya, pay with M-Pesa, and carry your ticket on your phone.</p>
      <div class="dots rise" style="--i:5"><button class="on" aria-label="Slide 1"></button><button aria-label="Slide 2"></button><button aria-label="Slide 3"></button></div>
    </div>
  </section>

  <aside class="panel rise" style="--i:1">
    <form id="login-form">
      <h2 class="rise" style="--i:3">Welcome back</h2>
      <p class="lede rise" style="--i:4">Log in to see your tickets and discover events near you.</p>
      <div id="error-box" class="alert alert-error" role="alert"></div>

      <div class="field rise" style="--i:5">
        <label for="email">Email address</label>
        <div class="input"><input id="email" type="email" placeholder="Enter your email" autocomplete="email" required></div>
      </div>
      <div class="field rise" style="--i:6">
        <label for="password">Password</label>
        <div class="input">
          <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required style="padding-right:calc(60*var(--u))">
          <button type="button" class="eye" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 20L20 4"/></svg>
          </button>
        </div>
      </div>
      <div class="row rise" style="--i:7">
        <label class="check"><input type="checkbox" id="rememberMe">Remember me</label>
        <a class="link-accent" href="/forgot-password.html">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary rise" style="--i:8" id="submit-btn">Log in</button>
      <p class="foot rise" style="--i:9">New here? <a class="link-accent" id="register-link" href="/register.html">Create an account</a></p>
    </form>
  </aside>
</main>

<script src="/js/api.js"></script>
<script src="/js/brand.js"></script>
<script>
// Only follow ?next=/something on our own site (blocks open redirects).
function safeNext() {
  const n = new URLSearchParams(window.location.search).get('next');
  return n && n.startsWith('/') && !n.startsWith('//') ? n : null;
}
// Keep ?next= when the user goes to register instead.
document.getElementById('register-link').href = '/register.html' + window.location.search;

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const box = document.getElementById('error-box');
  box.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        rememberMe: document.getElementById('rememberMe').checked
      }),
    });
    const destinations = {
      attendee: '/events.html',
      organiser: '/organiser-dashboard.html',
      admin: '/admin-dashboard.html',
      gate_agent: '/gate-scan.html',
    };
    window.location.href = safeNext() || destinations[data.role] || '/events.html';
  } catch (err) {
    showError(err.message);
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
