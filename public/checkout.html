<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <a href="javascript:history.back()">&larr;</a>
  <span>Checkout</span>
  <span></span>
</div>
<div class="container" style="max-width:420px;">
  <div id="error-box" class="alert alert-error" style="display:none;"></div>

  <div class="card" id="summary-card"></div>

  <div class="field">
    <label>Quantity</label>
    <input type="number" id="quantity" value="1" min="1" max="10">
  </div>

  <div class="card" id="total-card" style="display:flex; justify-content:space-between; align-items:center;">
    <span style="color:var(--sub);">Total</span>
    <strong id="total-amount" style="color:var(--navy); font-size:18px;"></strong>
  </div>

  <h3>Payment method</h3>
  <div style="display:flex; gap:10px; margin-bottom:16px;">
    <div class="card pay-option selected" data-method="mpesa" style="flex:1; text-align:center; cursor:pointer;">M-Pesa</div>
    <div class="card pay-option" data-method="card" style="flex:1; text-align:center; cursor:pointer; opacity:0.5;">Card (soon)</div>
  </div>

  <div class="field">
    <label>M-Pesa phone number</label>
    <input type="tel" id="phone" placeholder="07XX XXX XXX or 2547XX XXX XXX" required>
  </div>

  <button class="btn btn-primary" id="pay-btn">Pay now</button>
</div>

<script src="/js/api.js"></script>
<script>
  const EYE_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSED = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a20.3 20.3 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a20.3 20.3 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x₁="₁" y₁="₁" x₂="₂" y₂="₂"/></svg>';

function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.innerHTML = input.type === 'password' ? EYE_OPEN : EYE_CLOSED;
}
startBackgroundRotator([
  'https://www.pexels.com/photo/a-person-walking-while-carrying-a-backpack-10521177/',
  'https://images.pexels.com/photos/20179680/pexels-photo-20179680.jpeg',
  'https://images.pexels.com/photos/30174882/pexels-photo-30174882.jpeg',
  'https://images.unsplash.com/photo-1573152958734-1922c188fba3?q=80&w=1032&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?q=80&w=1007&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://images.pexels.com/photos/4555454/pexels-photo-4555454.jpeg',
  'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://unsplash.com/photos/man-playing-drums-PKmjFH8dGMU'
]);
</script>
<script>
const params = new URLSearchParams(window.location.search);
const categoryId = params.get('categoryId');
const eventTitle = params.get('eventTitle');
const catName = params.get('catName');
const price = Number(params.get('price'));

function updateTotal() {
  const qty = Number(document.getElementById('quantity').value) || 1;
  document.getElementById('total-amount').textContent = money(price * qty);
}

document.getElementById('summary-card').innerHTML = `
  <strong>${eventTitle}</strong>
  <div style="color:var(--sub); font-size:13px; margin-top:4px;">${catName} &middot; ${money(price)} each</div>
`;
document.getElementById('quantity').addEventListener('input', updateTotal);
updateTotal();

document.getElementById('pay-btn').addEventListener('click', async () => {
  let phone = document.getElementById('phone').value.trim();
  if (!phone) return showError('Enter your M-Pesa phone number.');

  // Normalize to Safaricom's expected format: 2547XXXXXXXX
  phone = phone.replace(/\s+/g, '');       // remove spaces
  phone = phone.replace(/^\+/, '');         // strip a leading +
  if (phone.startsWith('0')) {
    phone = '254' + phone.slice(1);         // 07XXXXXXXX -> 2547XXXXXXXX
  } else if (phone.startsWith('7') || phone.startsWith('1')) {
    phone = '254' + phone;                  // 7XXXXXXXX -> 2547XXXXXXXX
  }
  // if it already starts with 254, leave it as-is

  if (!/^254(7|1)\d{8}$/.test(phone)) {
    return showError('Enter a valid Kenyan phone number, e.g. 0712345678.');
  }

  const btn = document.getElementById('pay-btn');
  btn.disabled = true;
  btn.textContent = 'Sending prompt...';

  try {
    const data = await api('/payments/checkout', {
      method: 'POST',
      body: JSON.stringify({
        categoryId: Number(categoryId),
        quantity: Number(document.getElementById('quantity').value),
        phoneNumber: phone,
      }),
    });
    window.location.href = `/payment-pending.html?transactionId=${data.transactionId}`;
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = 'Pay now';
  }
});
</script>
</body>
</html>
