<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan ticket - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/translations.js"></script>
<script src="/js/settings.js"></script>
</head>
<body>
<div class="topbar">Scan ticket</div>
<div class="container" id="main" style="max-width:480px;">
  <div class="card" id="my-events-card">
    <strong>You're checking in guests for:</strong>
    <div id="my-events-list" style="margin-top:8px;"></div>
  </div>

  <form id="scan-form" autocomplete="off">
    <div class="field">
      <label for="qrToken">Ticket code</label>
      <input type="text" id="qrToken" placeholder="Type or paste the ticket's code" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    </div>
    <button type="submit" class="btn btn-primary" id="scan-btn">Check ticket</button>
  </form>

  <div id="result" role="status" aria-live="assertive" style="margin-top:20px;"></div>

  <h2 style="font-size:1.125rem; margin-top:32px;">Today's scans</h2>
  <div id="history"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/footer.js"></script>
<script>
const resultEl = document.getElementById('result');
const input = document.getElementById('qrToken');

// One large, high-contrast answer: icon + words + colour, so it can be read at a glance in a crowd
function showResult(kind, title, lines) {
  const mark = { ok: '&#10003;', warn: '!', bad: '&#10005;' }[kind];
  resultEl.innerHTML = `
    <div class="scan-result scan-${kind}">
      <div class="scan-icon" aria-hidden="true">${mark}</div>
      <div class="scan-title">${esc(title)}</div>
      ${lines.join('')}
    </div>`;
  // a short buzz on phones: one pulse for "let in", a double pulse for "stop"
  if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 80 : [120, 80, 120]);
}

async function scan(token) {
  try {
    const res = await fetch('/api/gate/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ qrToken: token }),
    });
    const data = await res.json().catch(() => ({}));

    if (data.result === 'valid') {
      const lines = [];
      if (data.eventTitle) lines.push(`<div class="scan-line">${esc(data.eventTitle)}${data.categoryName ? ' &middot; ' + esc(data.categoryName) : ''}</div>`);
      if (data.ageMin > 0) {
        // the age limit the organiser set for this event, shown where the agent cannot miss it
        lines.push(`<div class="scan-age">Age limit ${Number(data.ageMin)}+<br><span>Please check the guest's age before they enter.</span></div>`);
      } else if (data.familyFriendly) {
        lines.push('<div class="scan-line">Family friendly event</div>');
      }
      showResult('ok', 'Entry approved', lines);
    } else if (data.result === 'already_used') {
      const when = data.usedAt ? new Date(data.usedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const lines = [];
      if (data.eventTitle) lines.push(`<div class="scan-line">${esc(data.eventTitle)}</div>`);
      if (when) lines.push(`<div class="scan-line">Scanned in at ${esc(when)}</div>`);
      showResult('warn', 'Already used', lines);
    } else {
      showResult('bad', data.message || data.error || 'Not valid', []);
    }
  } catch (err) {
    showResult('bad', 'Could not reach the server', ['<div class="scan-line">Check your connection and try again.</div>']);
  }
  loadHistory();
}

document.getElementById('scan-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const token = input.value.trim();
  if (!token) { input.focus(); return; }
  input.value = '';
  scan(token);
  input.focus();               // ready for the next guest straight away
});

async function loadHistory() {
  try {
    const { scans } = await api('/gate/history');
    document.getElementById('history').innerHTML = scans.map((s) => `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <span>Ticket ${esc(s.ticket_id || '—')}</span>
        <span class="badge ${s.result === 'valid' ? 'badge-success' : (s.result === 'already_used' ? 'badge-warn' : 'badge-danger')}">${esc(s.result)}</span>
      </div>`).join('');
  } catch (err) { /* not logged in yet */ }
}

async function loadMyEvents() {
  const list = document.getElementById('my-events-list');
  try {
    const { events } = await api('/gate-assignments/mine');
    list.innerHTML = events.length === 0
      ? '<span style="color:var(--sub); font-size:0.8125rem;">No events assigned yet. Contact your organiser.</span>'
      : events.map((e) => `<span class="badge badge-info" style="margin:2px;">${esc(e.title)}</span>`).join('');
  } catch (err) {
    list.innerHTML = '<span style="color:var(--danger-text); font-size:0.8125rem;">Please log in as a gate agent.</span>';
  }
}

loadMyEvents();
loadHistory();
renderNav('home');
input.focus();
</script>
</body>
</html>
