<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">Dashboard</div>
<div id="app-nav"></div>
<div class="container">
  <div class="stat-grid" id="stats"></div>
  <a href="/organiser-create-event.html" class="btn btn-primary" style="margin-bottom:20px; display:block;">+ Create event</a>
  <div style="display:flex; gap:8px; margin-bottom:20px;">
  <a href="/organiser-agents.html" class="btn btn-outline" style="flex:1;">Gate Agents</a>
  <a href="/organiser-reports.html" class="btn btn-outline" style="flex:1;">Reports</a>
    <a href="/organiser-updates.html" class="btn btn-outline" style="flex:1;">Updates</a>
</div>
  <h3>My events</h3>
  <div id="event-list">Loading...</div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
  const EYE_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSED = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a20.3 20.3 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a20.3 20.3 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x₁="₁" y₁="₁" x₂="₂" y₂="₂"/></svg>';

function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.innerHTML = input.type === 'password' ? EYE_OPEN : EYE_CLOSED;
}
startBackgroundRotator([
  'https://www.pexels.com/photo/a-person-walking-while-carrying-a-backpack-10521177/',
  'https://images.pexels.com/photos/20179680/pexels-photo-20179680.jpeg',
  'https://images.pexels.com/photos/30174882/pexels-photo-30174882.jpeg',
  'https://images.unsplash.com/photo-1573152958734-1922c188fba3?q=80&w=1032&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?q=80&w=1007&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://images.pexels.com/photos/4555454/pexels-photo-4555454.jpeg',
  'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D',
  'https://unsplash.com/photos/man-playing-drums-PKmjFH8dGMU'
]);
</script>
<script>
const statusBadge = {
  published: '<span class="badge badge-success">Published</span>',
  draft: '<span class="badge badge-warn">Draft</span>',
  cancelled: '<span class="badge badge-danger">Cancelled</span>',
};

async function load() {
  try {
    const { events } = await api('/events/mine');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="label">Total events</div><div class="value">${events.length}</div></div>
      <div class="stat-card"><div class="label">Published</div><div class="value">${events.filter(e => e.status === 'published').length}</div></div>
    `;
    const list = document.getElementById('event-list');
    if (events.length === 0) {
      list.innerHTML = '<p style="color:var(--sub);">No events yet.</p>';
      return;
    }
  list.innerHTML = events.map(ev => {
  const thumbStyle = ev.cover_image_url
  ? `background-image:url('${ev.cover_image_url}'); background-size:cover; background-position:center;`
  : '';
  const date = new Date(ev.event_date).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  return `
    <div class="card" style="padding:0; overflow:hidden;">
<div class="event-thumb" style="height:220px; ${thumbStyle}"></div>
      <div style="padding:12px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <strong>${ev.title}</strong>
            <div style="font-size:12px; color:var(--sub); margin-top:4px;">${date} &middot; ${ev.venue || ''}</div>
          </div>
          ${statusBadge[ev.status] || ''}
        </div>
        <a href="/organiser-create-ticket.html?eventId=${ev.event_id}" style="display:block; font-size:12px; color:var(--navy); font-weight:600; margin-top:10px;">Edit event</a>
                ${ev.status === 'published' ? `<button class="btn btn-outline" style="margin-top:10px; color:var(--danger-text); border-color:var(--danger-text);" onclick="cancelEvent(${ev.event_id})">Cancel event</button>` : ''}
      </div>
    </div>
  `;
}).join('');
  } catch (err) {
    document.getElementById('event-list').innerHTML = '<p style="color:var(--danger-text);">Please log in as an organiser.</p>';
  }
}
async function cancelEvent(eventId) {
  if (!confirm('Cancel this event?\n\nTicket sales stop immediately and attendees will see it marked as cancelled. This cannot be undone.')) return;
  try {
    await api('/events/' + eventId + '/cancel', { method: 'PATCH' });
    load();
  } catch (err) {
    alert(err.message);
  }
}
load();
renderNav('home');
</script>
</body>
</html>
