<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add tickets - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">Add ticket categories</div>
<div class="container" style="max-width:420px;">
  <div id="error-box" class="alert alert-error" style="display:none;"></div>
  <div class="card" id="event-summary" style="margin-bottom:20px;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <strong id="event-title-display">Loading...</strong>
    <a href="/organiser-create-event.html?eventId=' + eventId" id="edit-details-link" style="font-size:13px; color:var(--navy); font-weight:600;">Edit event details</a>
  </div>
</div>

  <div id="existing-cats"></div>

  <form id="cat-form">
    <div class="field"><label>Category name</label><input type="text" id="name" placeholder="e.g. VIP" required></div>
    <div class="field"><label>Price (KES)</label><input type="number" id="price" min="0" required></div>
    <div class="field"><label>Quota</label><input type="number" id="quota" min="1" required></div>
    <button type="submit" class="btn btn-outline">+ Add category</button>
  </form>
  <div class="card">
  <strong>Invite a Gate Agent</strong>
  <div class="field" style="margin-top:10px;">
    <input type="email" id="agentEmail" placeholder="agent@example.com">
  </div>
  <button class="btn btn-outline" id="invite-btn">Send invite</button>
</div>

  <button class="btn btn-primary" id="publish-btn" style="margin-top:20px;">Publish event</button>
</div>

<script src="/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const eventId = params.get('eventId');

async function loadEventSummary() {
  const { event } = await api('/events/' + eventId);
  document.getElementById('event-title-display').textContent = event.title;
  document.getElementById('edit-details-link').href = '/organiser-create-event.html?eventId=' + eventId;
}

async function loadCategories() {
  const { categories } = await api('/ticket-categories/event/' + eventId);
  document.getElementById('existing-cats').innerHTML = categories.map(c => `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;"
         onclick="editCategory(${c.category_id}, '${c.name}', ${c.price}, ${c.quota})">
      <span>${c.name}</span><span>${money(c.price)} &middot; Qty ${c.quota}</span>
    </div>
  `).join('');
}

function editCategory(id, name, price, quota) {
  document.getElementById('name').value = name;
  document.getElementById('price').value = price;
  document.getElementById('quota').value = quota;
  document.getElementById('cat-form').dataset.editingId = id;
  document.querySelector('#cat-form button[type="submit"]').textContent = 'Save changes';
}

document.getElementById('cat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = document.getElementById('cat-form');
  const editingId = form.dataset.editingId;
  const payload = {
    eventId: Number(eventId),
    name: document.getElementById('name').value,
    price: Number(document.getElementById('price').value),
    quota: Number(document.getElementById('quota').value),
  };
  try {
    if (editingId) {
      await api('/ticket-categories/' + editingId, { method: 'PUT', body: JSON.stringify(payload) });
      delete form.dataset.editingId;
      document.querySelector('#cat-form button[type="submit"]').textContent = '+ Add category';
    } else {
      await api('/ticket-categories', { method: 'POST', body: JSON.stringify(payload) });
    }
    form.reset();
    loadCategories();
  } catch (err) {
    showError(err.message);
  }
});

document.getElementById('publish-btn').addEventListener('click', async () => {
  try {
    await api('/events/' + eventId + '/publish', { method: 'PATCH' });
    alert('Event published!');
    window.location.href = '/organiser-dashboard.html';
  } catch (err) {
    showError(err.message);
  }
});
document.getElementById('invite-btn').addEventListener('click', async () => {
  try {
    await api('/gate-assignments/invite', {
      method: 'POST',
      body: JSON.stringify({ eventId: Number(eventId), gateAgentEmail: document.getElementById('agentEmail').value }),
    });
    alert('Invitation sent — awaiting admin approval.');
  } catch (err) { showError(err.message); }
});

loadCategories();
loadEventSummary();
</script>
</body>
</html>
