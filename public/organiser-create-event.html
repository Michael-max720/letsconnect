<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create event - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <a href="/organiser-dashboard.html">&larr;</a>
  <span>Create event</span>
  <span></span>
</div>
<div class="container" style="max-width:420px;">
  <div id="error-box" class="alert alert-error" style="display:none;"></div>
  <form id="event-form">
    <div class="field">
      <label>Cover image URL</label>
      <div class="img-preview" id="img-preview">No image yet &mdash; paste a link below</div>
      <input type="url" id="coverImageUrl" placeholder="https://example.com/poster.jpg">
    </div>
    <div class="field"><label>Event title</label><input type="text" id="title" required></div>
    <div class="field"><label>Category</label>
      <select id="category">
        <option>Music</option><option>Safari</option><option>Conference</option><option>Sports</option><option>Comedy</option>
      </select>
    </div>
    <div class="field"><label>Description</label><textarea id="description" rows="3"></textarea></div>
    <div class="field"><label>Venue</label><input type="text" id="venue" required></div>
    <div class="field"><label>Date and time</label><input type="datetime-local" id="eventDate" required></div>
    <button type="submit" class="btn btn-primary">Next: add tickets</button>
  </form>
</div>

<script src="/js/api.js"></script>
<script>
const preview = document.getElementById('img-preview');
document.getElementById('coverImageUrl').addEventListener('input', (e) => {
  const url = e.target.value.trim();
  if (url) {
    preview.style.backgroundImage = `url('${url}')`;
    preview.style.backgroundSize = 'cover';
    preview.style.backgroundPosition = 'center';
    preview.textContent = '';
  } else {
    preview.style.backgroundImage = 'none';
    preview.textContent = 'No image yet — paste a link below';
  }
});

const params = new URLSearchParams(window.location.search);
const editingEventId = params.get('eventId');

if (editingEventId) {
  document.querySelector('button[type="submit"]').textContent = 'Save changes';
  api('/events/' + editingEventId).then(({ event }) => {
    document.getElementById('title').value = event.title;
    document.getElementById('category').value = event.category || 'Music';
    document.getElementById('description').value = event.description || '';
    document.getElementById('venue').value = event.venue || '';
    document.getElementById('coverImageUrl').value = event.cover_image_url || '';
    document.getElementById('eventDate').value = event.event_date.slice(0, 16);
    if (event.cover_image_url) {
      document.getElementById('coverImageUrl').dispatchEvent(new Event('input'));
    }
  });
}
document.getElementById('event-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    title: document.getElementById('title').value,
    category: document.getElementById('category').value,
    description: document.getElementById('description').value,
    venue: document.getElementById('venue').value,
    eventDate: document.getElementById('eventDate').value.replace('T', ' ') + ':00',
    coverImageUrl: document.getElementById('coverImageUrl').value.trim() || null,
  };
  try {
    if (editingEventId) {
      await api('/events/' + editingEventId, { method: 'PUT', body: JSON.stringify(payload) });
      window.location.href = '/organiser-dashboard.html';
    } else {
      const data = await api('/events', { method: 'POST', body: JSON.stringify(payload) });
      window.location.href = '/organiser-create-ticket.html?eventId=' + data.eventId;
    }
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>
