<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gate Agents - Lets Connect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">Gate Agents</div>
<div id="app-nav"></div>
<div class="container">
  <div id="error-box" class="alert alert-error" style="display:none;"></div>

  <div class="card">
    <strong>Create a Gate Agent</strong>
    <div class="field" style="margin-top:12px;"><label>Full name</label><input type="text" id="name" required></div>
    <div class="field"><label>Email</label><input type="email" id="email" required></div>
    <div class="field"><label>Phone</label><input type="tel" id="phone"></div>
   <div class="field">
  <label>Temporary password</label>
  <div style="position:relative;">
    <input type="password" id="password" required minlength="6" style="padding-right:44px;">
    <button type="button" class="pw-toggle" onclick="togglePassword('password', this)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--sub);"></button>
  </div>
</div>
<div class="field">
  <label>Confirm password</label>
  <div style="position:relative;">
    <input type="password" id="confirmPassword" required minlength="6" style="padding-right:44px;">
  <button type="button" class="pw-toggle" onclick="togglePassword('confirmPassword', this)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--sub);"></button>
  </div>
</div>
    <div class="field"><label>Assign to event</label><select id="eventSelect"></select></div>
    <button class="btn btn-primary" id="create-btn">Create account</button>
  </div>

  <h3 style="margin-top:24px;">Your Gate Agents</h3>
  <div id="agent-list">Loading...</div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
    const EYE_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSED = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a20.3 20.3 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a20.3 20.3 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.innerHTML = input.type === 'password' ? EYE_OPEN : EYE_CLOSED;
}
async function loadEventOptions() {
  const { events } = await api('/events/mine');
  document.getElementById('eventSelect').innerHTML = events.map(e => `<option value="${e.event_id}">${e.title}</option>`).join('');
}

async function loadAgents() {
  try {
    const { agents } = await api('/organiser/agents');
    const list = document.getElementById('agent-list');
    if (agents.length === 0) { list.innerHTML = '<p style="color:var(--sub);">No gate agents yet.</p>'; return; }
    list.innerHTML = agents.map(a => `
      <div class="card">
        <strong>${a.name}</strong>
        <span class="badge ${a.account_status === 'active' ? 'badge-success' : 'badge-warn'}" style="margin-left:8px;">${a.account_status}</span>
        <div style="font-size:12px; color:var(--sub); margin-top:6px;">${a.email}</div>
        <div style="font-size:12px; color:var(--sub); margin-top:4px;">Events: ${a.events}</div>
      </div>
    `).join('');
  } catch (err) {
    document.getElementById('agent-list').innerHTML = '<p style="color:var(--danger-text);">Please log in as an organiser.</p>';
  }
}

document.getElementById('create-btn').addEventListener('click', async () => {
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (password !== confirmPassword) {
    return showError('Passwords do not match.');
  }
  try {
    await api('/organiser/agents', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        eventId: Number(document.getElementById('eventSelect').value),
      }),
    });
    alert('Agent account created. Share the email and temporary password with them. Awaiting admin approval.');
    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('password').value = '';
    document.getElementById('confirmPassword').value = '';
    loadAgents();
  } catch (err) { showError(err.message); }
});
function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.innerHTML = input.type === 'password' ? EYE_OPEN : EYE_CLOSED;
}
document.querySelectorAll('.pw-toggle').forEach(btn => btn.innerHTML = EYE_OPEN);

loadEventOptions();
loadAgents();
renderNav('agents');
</script>
</body>
</html>
